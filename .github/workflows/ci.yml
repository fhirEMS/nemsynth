name: CI

on:
  push:
    branches: [main]
  pull_request:

# Self-contained by design: nemsynth must never depend on its consumer, not
# even at test time. A generator that needs the mapper to prove itself would be
# back to only generating what the mapper already handles.
jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: python -m pytest

  generate:
    name: generation at volume (XSD-valid + reproducible)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      # The core contract, at a volume unit tests do not reach: every document
      # passes the real NEMSIS XSDs. generate_one() self-validates, so a
      # regression in the schema walker fails here rather than shipping a
      # corpus that quietly teaches its consumer the wrong lesson.
      - name: Generate 300 documents against both releases
        run: |
          for version in 3.5.0 3.5.1; do
            python -m nemsynth gen --seed 1 --count 300 \
                --version "$version" -o "out-$version"
            count=$(ls "out-$version" | wc -l)
            [ "$count" -eq 300 ] || { echo "expected 300, got $count" >&2; exit 1; }
          done

      # Reproducibility is not a nicety: a defect found by generated document
      # #8,412 is worthless if the corpus cannot be regenerated byte-for-byte.
      - name: Same seed must reproduce byte-identically
        run: |
          python -m nemsynth gen --seed 77 --count 20 -o first
          python -m nemsynth gen --seed 77 --count 20 -o second
          diff -r first second || { echo "seeded output is not reproducible" >&2; exit 1; }

      # Provenance must stay intact — a distribution silently losing its source,
      # or an assumption quietly promoted to "measured", is a correctness bug in
      # a project whose whole claim is that its numbers are grounded.
      - name: Distribution provenance is intact
        run: |
          python -m nemsynth sources | tee sources.txt
          grep -q "nemsis.org" sources.txt
          grep -q "measured " sources.txt
          grep -q "ASSUMED" sources.txt
